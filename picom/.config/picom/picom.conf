# Shadow
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
# shadow-opacity = 0.7;
shadow-exclude = [
	"name = 'Notification'",
	"class_g = 'Conky'",
	"class_g ?= 'Notify-osd'",
	"class_g = 'Cairo-clock'",
	"class_g = '/usr/bin/chromium-snapshot-bin'",
	"name ?= '[i3 con]'",
	"name ?= 'urxvt'",
	"_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
	"_GTK_FRAME_EXTENTS@:c"
];

# Opacity
frame-opacity = 0.9;
inactive-opacity-override = false;
# inactive-dim = 0.2;
# inactive-dim-fixed = true;

# Blur (picom uses a different syntax from compton)
# blur-method = "gaussian";
# blur-size = 12;
# blur-deviation = 5.0;
# blur-background = true;
# blur-background-frame = true;
# blur-background-fixed = true;
blur-background-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"_GTK_FRAME_EXTENTS@:c"
];

# opacity-rule = [
#   "95:class_g = 'URxvt' && !focused",
#   "100:class_g = 'URxvt' && focused",
#   "95:class_g = 'Xterm' && !focused",
#   "100:class_g = 'Xterm' && focused"
# ];


# Fading
# fading = true;
# fade-delta = 30;
fade-in-step = 0.03;
fade-out-step = 0.03;
# no-fading-openclose = true;
# no-fading-destroyed-argb = true;
fade-exclude = [];


# Backend
backend = "xrender";
# backend = "glx";
vsync = false;
mark-wmwin-focused = false;
mark-ovredir-focused = true;
# use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;
# unredir-if-possible = true;
focus-exclude = [ "class_g = 'Cairo-clock'" ];
detect-transient = true;
detect-client-leader = true;

# Rounded corners (picom feature, not available in compton)
# corner-radius = 8;
# rounded-corners-exclude = [
#   "window_type = 'dock'",
#   "window_type = 'desktop'"
# ];

# GLX backend options
# glx-no-stencil = true;
glx-copy-from-front = false;
# glx-no-rebind-pixmap = true;

# Window type settings
wintypes:
{
  tooltip   = { fade = true; shadow = true; opacity = 0.9; focus = true; };
  dock      = { shadow = false; };
  dnd       = { shadow = false; };
  popup_menu    = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
