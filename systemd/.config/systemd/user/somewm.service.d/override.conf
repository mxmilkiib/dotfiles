[Service]
ExecStart=
# ~/bin/somewm is the somewm-plus launcher: it rebuilds the tree when
# stale and supplies -L for its own Lua libs (else the build searches
# /usr/local/share/somewm/lua and ./lua)
ExecStart=/home/milkii/bin/somewm
# Upstream somewm-git package binary
# ExecStart=/usr/bin/somewm
# Arm the displays popup's hdr chip: it toggles BT.2020/PQ on outputs
# advertising support (inert otherwise). Opt-in because the atomic commit
# hard-hung on an older kernel; 7.3.x carries the fixes
Environment=SOMEWM_HDR_UNSAFE=1
