[Unit]
StartLimitIntervalSec=30
StartLimitBurst=5

[Service]
# Kdeconnectd aborts when the Wayland socket is missing at autostart; wait for the compositor
ExecStartPre=/bin/sh -c 'for i in $$(seq 100); do [ -S "$$XDG_RUNTIME_DIR/$${WAYLAND_DISPLAY:-wayland-0}" ] && exit 0; sleep 0.1; done; exit 1'
Restart=on-failure
RestartSec=2
